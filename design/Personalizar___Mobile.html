<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col pb-24">

        <span data-design-text-token="title-md" class="font-headline text-title-md text-on-surface">Personalizar peça</span>
      </a>
      <span data-design-text-token="label-sm" class="font-label text-label-sm text-on-surface-variant tabular-nums">5 / 6</span>
    </div>
  </header>

  <main class="flex-1 px-gutter-md py-gutter-lg flex flex-col gap-gutter-lg">

    <article class="bg-surface-container rounded-lg border border-outline-variant p-gutter-md shadow-sm flex flex-col gap-gutter-md">
      <div class="flex items-center justify-between">
        <span data-design-text-token="title-md" class="font-title text-title-md text-on-surface">Esboço digital</span>
        <span class="px-2.5 py-1 rounded-full bg-gold-tint text-on-gold-tint border border-gold/40">
          <span data-design-text-token="label-sm" class="font-label text-label-sm">Aço inox dourado</span>
        </span>
      </div>

      <div class="rounded-md bg-surface-container-low border border-outline-variant p-gutter-md flex flex-col items-center">
        <svg viewBox="0 0 360 130" class="w-full h-auto" aria-label="Pré-visualização da mascote personalizada">
          <defs>
            <linearGradient id="m-gold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#E7C873"></stop>
              <stop offset="50%" stop-color="#B8893B"></stop>
              <stop offset="100%" stop-color="#DFB963"></stop>
            </linearGradient>
          </defs>
          <path d="M16 65 H78" stroke="url(#m-gold)" stroke-width="3.5" stroke-dasharray="6 4" stroke-linecap="round"></path>
          <path d="M282 65 H344" stroke="url(#m-gold)" stroke-width="3.5" stroke-dasharray="6 4" stroke-linecap="round"></path>
          <rect x="78" y="38" width="204" height="54" rx="14" fill="url(#m-gold)"></rect>

        </svg>
      </div>

      <button type="button" class="inline-flex items-center justify-center gap-2 w-full py-3 rounded-full bg-primary text-on-primary border border-gold/50">
        <span class="material-symbols-outlined text-gold-light text-title-md" aria-hidden="true">verified</span>
        <span data-design-text-token="label-lg" class="font-label text-label-lg">Aprovo este esboço</span>
      </button>
    </article>

    <!-- Step 1: Peça -->
    <section class="bg-surface-container rounded-lg border border-outline-variant p-gutter-md flex flex-col gap-gutter-sm">
      <h2 data-design-text-token="title-md" class="font-title text-title-md text-on-surface">1. Que peça queres criar?</h2>
      <div class="flex flex-col gap-gutter-xs">
        <button type="button" class="flex items-center justify-between p-3 rounded-md border border-outline-variant bg-surface text-left">
          <span data-design-text-token="label-lg" class="font-label text-label-lg text-on-surface">Colar com nome</span>
          <span data-design-text-token="body-sm" class="font-body text-body-sm text-on-surface-variant tabular-nums">7.000 Kz</span>
        </button>
        <button type="button" class="flex items-center justify-between p-3 rounded-md border-2 border-primary bg-gold-tint/35 text-left">
          <span data-design-text-token="label-lg" class="font-label text-label-lg text-on-surface">Mascote de bebé</span>

        </button>
        <button type="button" class="flex items-center justify-between p-3 rounded-md border border-outline-variant bg-surface text-left">

      <input type="text" value="Rael Manuel" class="w-full rounded-md bg-surface border border-outline-variant px-3 py-2.5 text-body-md text-on-surface">
      <span data-design-text-token="body-sm" class="font-body text-body-sm text-on-surface-variant">Confere os acentos, gravamos exatamente como escreveres.</span>
      <div class="grid grid-cols-2 gap-gutter-xs pt-1">
        <button type="button" class="p-3 rounded-md border-2 border-gold bg-gold-tint/30 text-center">
          <span class="block text-on-surface" style="font-family: &#39;Great Vibes&#39;, cursive; font-size: 22px;">Rael Manuel</span>
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-on-surface-variant">B01 Clássico</span>
        </button>
        <button type="button" class="p-3 rounded-md border border-outline-variant bg-surface text-center">
          <span class="block text-on-surface" style="font-family: &#39;Dancing Script&#39;, cursive; font-size: 20px;">Rael Manuel</span>
